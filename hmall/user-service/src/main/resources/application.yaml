server:
  port: 8083
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: ${JWT_KEYSTORE_PASSWORD:hmall123}  # 默认值仅用于本地开发
    tokenTTL: 30m
  swagger:
    title: 用户服务接口文档
    package: com.hmall.user.controller
  db:
    database: hm-user
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true
spring:
  redis:
    host: ${REDIS_HOST:192.168.100.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0