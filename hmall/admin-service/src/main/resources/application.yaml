server:
  port: 8090
spring:
  redis:
    host: ${REDIS_HOST:192.168.100.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
hm:
  admin:
    jwt:
      location: classpath:admin.jks
      alias: admin
      password: ${ADMIN_JWT_KEYSTORE_PASSWORD:admin123}
      tokenTTL: 2h
      refreshWindow: 30m
    auth:
      excludePaths:
        - /admin/login
        - /admin/register
        - /doc.html
        - /doc.html/**
        - /webjars/**
        - /swagger-resources/**
        - /v2/api-docs
        - /v3/api-docs
        - /favicon.ico
  swagger:
    title: hmall 管理后台接口文档
    package: com.hmall.admin.controller
  db:
    database: hm-admin
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true
