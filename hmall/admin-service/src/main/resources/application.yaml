server:
  port: 8090
spring:
  datasource:
    url: jdbc:mysql://${hm.db.host:192.168.100.128}:3306/hm-admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${hm.db.username:root}
    password: ${hm.db.password:123}
  redis:
    host: ${REDIS_HOST:192.168.100.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
hm:
  admin:
    jwt:
      location: classpath:admin.jks
      alias: admin
      password: ${ADMIN_JWT_KEYSTORE_PASSWORD:admin123}
      tokenTTL: 2h
      refreshWindow: 30m
    auth:
      excludePaths:
        - /admin/login
        - /admin/register
        - /doc.html
        - /doc.html/**
        - /webjars/**
        - /swagger-resources/**
        - /v2/api-docs
        - /v3/api-docs
        - /favicon.ico
  swagger:
    title: hmall 管理后台接口文档
    package: com.hmall.admin.controller
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true
