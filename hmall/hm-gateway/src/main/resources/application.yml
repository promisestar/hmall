server:
  port: 8080
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: ${JWT_KEYSTORE_PASSWORD:hmall123}  # 默认值仅用于本地开发
    tokenTTL: 30m           # token 总有效期
    refresh-window: 15m     # 续期冷却窗口：距上次签发超过此时间才允许续期
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /users/login/code
      - /users/code
      - /items/**
      - /hi
      - /admin/**
  ratelimit:
    enabled: true
    rules:
      - paths: ["/seckill/**"]
        max-requests: 1
        window-ms: 5000
spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0